<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.name }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="shortcut icon" type="image/x-icon" href="{{ site.baseurl }}/{{ site.favicon }}">
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/theme.css">
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/custom.css">
</head>
<body class="site-shell{% if page.layout == 'post' %} post-page{% endif %}">
    <header class="site-header">
        <div class="site-header-inner">
            <a class="site-brand" href="{{ site.baseurl }}/">{{ site.name }}</a>
            <nav class="site-nav" aria-label="メインメニュー">
                {% include menu-header.html %}
            </nav>
        </div>
    </header>

    <main class="site-content">
        {{ content }}
    </main>

    <footer class="site-footer">
        <div class="site-footer-inner">
            <span>{{ site.name }}</span>
            <span>© 2026 Shifu-totto</span>
        </div>
    </footer>
</body>
</html>
