---
title: "記事一覧"
layout: default
permalink: "/authors-list.html"
---

<div class="container article-list-page">
    <div class="section-heading">
        <p class="eyebrow">ALL ARTICLES</p>
        <h1>{{ page.title }}</h1>
    </div>
    <div class="post-feed">
        {% for post in site.posts %}
            {% include main-loop-card.html %}
        {% else %}
            <p class="empty-state">記事はまだありません。</p>
        {% endfor %}
    </div>
</div>
