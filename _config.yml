# Site
name: 'Shift-log'
description: '技術とゲームと雑記'
logo: 'assets/images/logo.png'
favicon: 'assets/images/favicon.ico'
url: 'https://github.com/shifu-totto/shift-log'
baseurl: '/shift-log'
disqus: ''
email: 'wowthemesnet@gmail.com'

include: ["_pages"]
permalink: /:title/

authors:
    Shifu-totto:
      name:           Shifu-totto
      site:           https://shifu-totto.github.io/shift-log/
      avatar:         /assets/images/avatar1.jpg
      bio:            "SecurityとFPSとレースが好きです"
      twitter:        https://x.com/Shifu_totto

# Defaults
defaults:

  # all posts
  - scope:
      path: "_posts"
    values:
      layout: post
      author: Shifu-totto
      avatar: /assets/images/avatar1.jpg
      
  # all pages
  - scope:
      path: "_pages"
    values:
      layout: page
      
# Syntax
markdown: kramdown
highlighter: rouge

# Exclude metadata and development time dependencies (like Grunt plugins)
exclude: [README.markdown, package.json, grunt.js, Gruntfile.js, Gruntfile.coffee, node_modules]